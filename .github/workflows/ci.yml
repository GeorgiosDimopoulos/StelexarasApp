name: .NET CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
jobs:
  build:

    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.SQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${{ secrets.SQL_SA_PASSWORD }}' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore workloads
      run: dotnet workload restore 
        
    - name: Install dependencies
      run: dotnet restore StelexarasApp.CI.slnf

    - name: Build
      run: dotnet build StelexarasApp.CI.slnf --configuration Release --no-restore

    - name: Run tests
      run: dotnet test StelexarasApp.CI.slnf --configuration Release --no-build --filter "FullyQualifiedName!~StelexarasApp.Tests.IntegrationTests"

    - name: Run integration tests      
      env:
        RUN_INTEGRATION_TESTS: 1
        SQL_CONNECTION_STRING: Server=localhost,1433;Database=StelexarasTests;User Id=sa;Password=${{ secrets.SQL_SA_PASSWORD }};TrustServerCertificate=True
      run: dotnet test StelexarasApp.CI.slnf --configuration Release --no-build --filter "FullyQualifiedName~StelexarasApp.Tests.IntegrationTests"